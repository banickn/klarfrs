[package]
name = "klarfrs"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "klarfrs"
crate-type = ["cdylib", "rlib"]
path ="src/lib.rs"

[dependencies]
pyo3 = { version = "0.27.2" }
regex = "1.10.6"
once_cell = "1.20.2"
log = "0.4.29"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[build-dependencies]
pyo3-build-config = "0.27.2"

[dev-dependencies]
tempfile = "3.2"


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
